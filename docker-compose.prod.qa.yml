# Isolated production verification stack — DOES NOT use dev .env or dev volumes.
#
#   docker compose -p pulsetrace-prod-qa -f docker-compose.prod.qa.yml ^
#     --env-file deploy/pulsetrace-prod-qa.env up --build -d
#
# Teardown (QA resources only):
#   docker compose -p pulsetrace-prod-qa -f docker-compose.prod.qa.yml down
# Do NOT use down -v if you want to keep QA volumes for inspection.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsetrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in QA env file}
      POSTGRES_DB: ${POSTGRES_DB:-pulsetrace_qa}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata_qa:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsetrace} -d ${POSTGRES_DB:-pulsetrace_qa}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in QA env file}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      AUTH_COOKIE_NAME: pulsetrace_access_token
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://127.0.0.1:8081,http://localhost:8081}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulsetrace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pulsetrace_qa}
      LOG_STORAGE_PATH: /app/data/uploads
      LOG_UPLOAD_MAX_BYTES: ${LOG_UPLOAD_MAX_BYTES:-10485760}
      RATE_LIMIT_AUTH_PER_MINUTE: 60
      RATE_LIMIT_EXPENSIVE_PER_MINUTE: 30
    volumes:
      - uploads_qa:/app/data/uploads
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/database', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata_qa:
  uploads_qa: