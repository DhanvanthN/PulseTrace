services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsetrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsetrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pulsetrace}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pulsetrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pulsetrace} -d ${POSTGRES_DB:-pulsetrace}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pulsetrace_pgdata: