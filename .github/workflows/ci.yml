name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsetrace
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: pulsetrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsetrace -d pulsetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://pulsetrace:ci_test_password@localhost:5432/pulsetrace
        run: alembic upgrade head
      - name: Pytest
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://pulsetrace:ci_test_password@localhost:5432/pulsetrace
          JWT_SECRET_KEY: test-jwt-secret-key-do-not-use-in-production
          LOG_STORAGE_PATH: /tmp/pulsetrace-test-uploads
        run: pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsetrace
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: pulsetrace_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsetrace -d pulsetrace_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql+psycopg://pulsetrace:ci_test_password@localhost:5432/pulsetrace_e2e
      JWT_SECRET_KEY: test-jwt-secret-key-do-not-use-in-production
      LOG_STORAGE_PATH: /tmp/pulsetrace-e2e-uploads
      APP_ENV: test
      LOG_LEVEL: WARNING
      E2E_API_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test -- --run

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser (Chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare upload directory
        run: mkdir -p /tmp/pulsetrace-e2e-uploads

      - name: Start API server
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn-e2e.log 2>&1 &
          echo $! > /tmp/uvicorn-e2e.pid

      - name: Wait for API health
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8000/api/v1/health/database" > /dev/null; then
              echo "API health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time" >&2
          tail -n 80 /tmp/uvicorn-e2e.log >&2 || true
          exit 1

      - name: Playwright E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-screenshots
          path: docs/screenshots/e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload API server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-uvicorn-log
          path: /tmp/uvicorn-e2e.log
          if-no-files-found: ignore
          retention-days: 7